server {
    listen 80;
    listen [::]:80;
    server_name hd117.com www.hd117.com;
    server_tokens off;
    client_max_body_size 16m;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location ~ ^/(health|auth|me|admin|patients|caregivers|consents|care-circle|care-precautions|assessments|ai|rehab-plans|collection-protocols|collection-batches|training-sessions|training-results|caregiver)(/|$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_hide_header X-Powered-By;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}
