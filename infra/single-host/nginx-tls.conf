server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hd117.com www.hd117.com;
    ssl_certificate /etc/letsencrypt/live/hd117.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hd117.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    if ($host = www.hd117.com) { return 301 https://hd117.com$request_uri; }
    server_tokens off;
    client_max_body_size 16m;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location ~ ^/(health|auth|me|admin|patients|caregivers|consents|care-circle|care-precautions|assessments|ai|rehab-plans|collection-protocols|collection-batches|training-sessions|training-results|caregiver)(/|$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_hide_header X-Powered-By;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hd117.com www.hd117.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://hd117.com$request_uri; }
}
