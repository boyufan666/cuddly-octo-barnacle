services:
  postgres:
    image: postgres:18
    container_name: rehab-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rehab
      POSTGRES_PASSWORD: "253913"
      POSTGRES_DB: rehab_platform
    ports:
      - "55432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehab -d rehab_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rehab-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
