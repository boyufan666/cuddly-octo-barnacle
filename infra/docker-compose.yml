services:
  postgres:
    image: postgres:18
    container_name: rehab-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rehab
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: rehab_platform
    ports:
      - "55432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehab -d rehab_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
